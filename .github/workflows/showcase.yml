name: Showcase

# The JVM vs native cycles of the Quarkus Desktop showcase (https://github.com/Eng-Fouad/quarkus-desktop-showcase) against
# this commit, on five platforms (Linux arm64 and x64, Windows x64 and arm64, macOS arm64) : on pull requests labelled
# "showcase", and manually. The workflow is the one of the showcase repository, whose own runs test quarkus-desktop main
# on every push to the showcase and every night (with more variants) : not on every push here, where its 12 jobs would
# queue on the runners that the Quarkiverse organization shares. Not a required check : a showcase regression does not
# block a merge.
on:
  pull_request:
    types: [ labeled, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      showcase-ref:
        description: Showcase branch, tag or commit
        default: main
      platforms:
        description: Platforms, a JSON array (Linux-arm64, Linux-x64, Windows-x64, Windows-arm64, macOS-arm64) ; empty for all five
        default: ''
      nightly:
        description: Also the nightly variants
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  showcase:
    # pull requests : labelled "showcase", and when the label added is that one (another label does not rerun it)
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'showcase')
          && (github.event.action != 'labeled' || github.event.label.name == 'showcase'))
    # on the job : the skipped runs of other labels do not cancel a running cycle ; one group per manual run
    concurrency:
      group: showcase-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: Eng-Fouad/quarkus-desktop-showcase/.github/workflows/cycle.yml@main
    with:
      desktop-repository: ${{ github.repository }}
      desktop-ref: ${{ github.sha }}
      showcase-ref: ${{ inputs.showcase-ref || 'main' }}
      platforms: ${{ inputs.platforms || '' }}
      nightly: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly }}
