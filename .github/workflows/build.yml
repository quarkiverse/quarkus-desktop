name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run'
        type: choice
        default: all
        options:
          - all
          - packaging

permissions:
  contents: read
  pull-requests: read

# A manual run of the packaging job alone has its group : it does not cancel the full build of the branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.jobs || 'all' }}
  cancel-in-progress: true

# bash runs the steps with -eo pipefail : a build piped to tee still fails its step
defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' }}
    name: JVM - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    # a hung GUI test (an event loop, a modal dialog) : about 2 minutes otherwise
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java-version: [ 21, 25 ]
        # macOS on Intel
        include:
          - os: macos-15-intel
            java-version: 25
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      # SWT needs GTK 3 on Linux
      - name: Install the GTK 3 runtime libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64

      # AWT, Swing and SWT tests need a display : a virtual X display on Linux
      - name: Build with Maven (virtual X display)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a ./mvnw -B -ntp clean install -Dno-format 2>&1 | tee maven.log

      - name: Build with Maven
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ./mvnw -B -ntp clean install -Dno-format 2>&1 | tee maven.log

      # The failed tests and the Maven errors as annotations of the run : shown in its summary, and readable through the
      # public API (check run annotations) without logging in, unlike the logs
      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log

  native:
    # GraalVM Community 25 Innovation (GraalVM 25.1 or later), which builds the AWT and Swing native executables of
    # macOS. On macOS, the event loop of an SWT native executable runs on the first thread of the process, and
    # NativeExecutableIT compares the minimum macOS version and the SDK version of the executable with the java launcher
    # of this GraalVM (otool -l)
    # exact : the integration tests built with --exact-reachability-metadata, in the default configuration of the
    # extensions (they fail on the first lookup missing from the metadata)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' }}
    name: Native${{ matrix.exact && ' (exact)' || '' }} on ${{ matrix.os }}
    # a hung native executable or GUI test : about 15 minutes otherwise
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        exact: [ false, true ]
    runs-on: ${{ matrix.os }}
    env:
      EXACT_ARGS: ${{ matrix.exact && '-Dquarkus.native.additional-build-args=--exact-reachability-metadata' || '' }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up GraalVM Community 25 Innovation 5 (JDK 25)
        run: bash .github/scripts/setup-graalvm.sh

      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: native-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: native-${{ runner.os }}-maven-

      # The AWT libraries of the native executable are linked dynamically : running it needs the X11, font, sound,
      # printing and GTK runtime libraries of the host, and a (virtual) X display (SWT loads GTK 3 too)
      - name: Install native build and run prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev xvfb fonts-dejavu-core \
            libx11-6 libxext6 libxrender1 libxi6 libxtst6 libfreetype6 libfontconfig1 libasound2t64 libcups2t64 \
            libgtk-3-0t64

      - name: Build native executables and run the integration tests (virtual X display)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a ./mvnw -B -ntp clean install -Dnative -Dno-format -Dnative.surefire.skip $EXACT_ARGS 2>&1 | tee maven.log

      - name: Build native executables and run the integration tests
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ./mvnw -B -ntp clean install -Dnative -Dno-format -Dnative.surefire.skip $EXACT_ARGS 2>&1 | tee maven.log

      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log

  packaging:
    # The packages of the integration tests of the Desktop Packaging extension, in every format of the operating system :
    # built by Maven with the tool of each format (PackagingIT checks the files), then installed, started and removed by
    # the steps below. In JVM mode (the jar with a Java runtime, built by jpackage) and for the native executable. In JVM
    # mode, the packages of a next version are installed over the first ones (msi, exe, deb), the macOS bundle is signed
    # with an identity rather than ad hoc. Linux has the snap too, and in JVM mode the AppImage of the next version
    # updates the first one (AppImageUpdate), and Windows installs the MSIX package from its App Installer file, then
    # the one of the next version. On arm64 (Windows : JVM mode only, GraalVM has no Windows arm64 native image) and on
    # macOS Intel too (JVM mode only, GraalVM 25 has no build for it)
    name: Packaging${{ matrix.native && ' (native)' || '' }} on ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        native: [ false, true ]
        include:
          - os: ubuntu-24.04-arm
            native: false
          - os: ubuntu-24.04-arm
            native: true
          - os: windows-11-arm
            native: false
          # JVM mode only : GraalVM 25 has no build for macOS on Intel
          - os: macos-15-intel
            native: false
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_ARGS: ${{ matrix.native && '-Dnative' || '' }}
      # The update information of the AppImage : the .zsync file of the latest version, which the step of the packages
      # of Linux serves on the loopback interface (an environment variable : sg runs the build in a shell, which would
      # take the | of a command line for a pipe)
      QUARKUS_DESKTOP_PACKAGING_LINUX_APPIMAGE_UPDATE_INFORMATION: 'zsync|http://127.0.0.1:8123/Packaging-IT-latest.AppImage.zsync'
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      # Temurin has no JDK 25 for Windows on arm64 : the Microsoft Build of OpenJDK there
      - name: Set up JDK 25
        if: ${{ !matrix.native }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.os == 'windows-11-arm' && 'microsoft' || 'temurin' }}
          java-version: 25

      - name: Set up GraalVM Community 25 Innovation 5 (JDK 25)
        if: ${{ matrix.native }}
        run: bash .github/scripts/setup-graalvm.sh

      # The dependencies of the packaging modules only : a cache of their own, not the one of the full builds, which
      # would then restore a partial repository
      - name: Cache the Maven repository of the packaging modules
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: packaging-${{ runner.os }}-${{ matrix.native }}-maven-${{ hashFiles('pom.xml', 'packaging/**/pom.xml') }}

      # dpkg-deb is part of Ubuntu. appimagetool, and the runtime that it puts at the head of each AppImage (which it
      # downloads from the latest build at each run otherwise) : releases, checked against their SHA-256
      - name: Install the packaging tools of Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev rpm dpkg-dev flatpak desktop-file-utils zsync nginx
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then
            arch=aarch64
            appimagetool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
            update_sha=7aaf89dd4cf66ebd940d416c67e1c240c57a139cee38d9c0ed3bb9387bc435b0
          else
            arch=x86_64
            appimagetool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
            update_sha=d976cdac667b03dee8cb23fb95ef74b042c406c5cbab3ff294d2b16efeaff84f
          fi
          curl -fsSL --retry 3 --retry-all-errors -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          echo "$appimagetool_sha  appimagetool" | sha256sum -c -
          sudo install -m 755 appimagetool /usr/local/bin/appimagetool
          rm appimagetool
          # the updater of the AppImages (AppImageUpdate), which the step of the packages runs
          curl -fsSL --retry 3 --retry-all-errors -o appimageupdatetool "https://github.com/AppImageCommunity/AppImageUpdate/releases/download/2.0.0-alpha-1-20251018/appimageupdatetool-$arch.AppImage"
          echo "$update_sha  appimageupdatetool" | sha256sum -c -
          sudo install -m 755 appimageupdatetool /usr/local/bin/appimageupdatetool
          rm appimageupdatetool
          runtime="$RUNNER_TEMP/runtime-$arch"
          curl -fsSL --retry 3 --retry-all-errors -o "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch"
          echo "$runtime_sha  $runtime" | sha256sum -c -
          echo "APPIMAGE_ARGS=-Dquarkus.desktop.packaging.linux.appimage.runtime-file=$runtime" >> "$GITHUB_ENV"

      # The snap, of the jar and of the native executable. Snapcraft and LXD come from the snap store, which does not
      # always answer the runners. Snapcraft builds the snap in an LXD container : the build runs in the lxd group
      - name: Install Snapcraft and LXD
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -x
          for attempt in 1 2 3; do sudo snap install snapcraft --classic && break || sleep 30; done
          snap list snapcraft || { echo "::error::Snapcraft could not be installed from the snap store"; exit 1; }
          for attempt in 1 2 3; do sudo snap install lxd && break || sleep 30; done
          snap list lxd || { echo "::error::LXD could not be installed from the snap store"; exit 1; }
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo iptables -P FORWARD ACCEPT
          echo "SNAP_FORMAT=,snap" >> "$GITHUB_ENV"

      # makeappx and signtool are part of the Windows SDK of the runner. An MSIX package is only installed when it is
      # signed : a self-signed certificate, trusted by the runner, whose subject is the publisher of the package. A root
      # certificate too, so that the signatures that it makes are valid, which the steps below check
      - name: Install the packaging tools of Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $file = "$env:RUNNER_TEMP\packaging-it.pfx"
          $password = ConvertTo-SecureString -String 'packaging-it' -Force -AsPlainText
          $certificate = New-SelfSignedCertificate -Type Custom -Subject 'CN=Quarkiverse' -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $certificate -FilePath $file -Password $password | Out-Null
          Import-PfxCertificate -FilePath $file -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -Password $password | Out-Null
          Import-PfxCertificate -FilePath $file -CertStoreLocation 'Cert:\LocalMachine\Root' -Password $password | Out-Null
          "SIGN_ARGS=-Dquarkus.desktop.packaging.windows.sign.certificate-file=$file -Dquarkus.desktop.packaging.windows.sign.certificate-password=packaging-it" >> $env:GITHUB_ENV
          # The App Installer file of the MSIX package, whose URLs are those of the server of the step of the packages
          'QUARKUS_DESKTOP_PACKAGING_WINDOWS_MSIX_UPDATE_URL=http://127.0.0.1:8124' >> $env:GITHUB_ENV

      # JVM mode on macOS : a self-signed code signing identity, in a keychain of its own, signs the bundle as a
      # Developer ID certificate does (the hardened runtime, a secure time stamp, the entitlements of the JVM) and the
      # disk image, where the native executable keeps the ad hoc signature of the default. Neither the installer package
      # nor the notarization : they need certificates of Apple. The identity is the SHA-1 hash of its certificate, which
      # codesign takes as it takes a name
      - name: Install a signing identity of macOS
        if: ${{ startsWith(matrix.os, 'macos') && !matrix.native }}
        run: |
          set -x
          keychain="$RUNNER_TEMP/packaging-it.keychain-db"
          cat > "$RUNNER_TEMP/packaging-it.cnf" << 'EOF'
          [req]
          distinguished_name = subject
          x509_extensions = extensions
          prompt = no
          [subject]
          CN = Packaging IT
          [extensions]
          basicConstraints = critical, CA:false
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$RUNNER_TEMP/packaging-it.cnf" \
            -keyout "$RUNNER_TEMP/packaging-it.key" -out "$RUNNER_TEMP/packaging-it.crt"
          # the algorithms that the keychain imports, rather than the defaults of OpenSSL 3
          openssl pkcs12 -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -passout pass:packaging-it \
            -inkey "$RUNNER_TEMP/packaging-it.key" -in "$RUNNER_TEMP/packaging-it.crt" -out "$RUNNER_TEMP/packaging-it.p12"
          security create-keychain -p packaging-it "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p packaging-it "$keychain"
          security import "$RUNNER_TEMP/packaging-it.p12" -k "$keychain" -f pkcs12 -P packaging-it -T /usr/bin/codesign
          # codesign uses the key without asking
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k packaging-it "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          security find-identity -p codesigning "$keychain"
          identity=$(openssl x509 -in "$RUNNER_TEMP/packaging-it.crt" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          echo "SIGN_ARGS=-Dquarkus.desktop.packaging.macos.sign.identity=$identity -Dquarkus.desktop.packaging.macos.sign.keychain=$keychain" >> "$GITHUB_ENV"

      # the lxd group exists on the runner, whose user is only a member of it once LXD is set up
      - name: Build the packages of Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          build="./mvnw -B -ntp install -pl packaging/integration-tests -am -Dno-format $NATIVE_ARGS -Dquarkus.desktop.packaging.formats=directory,deb,rpm,appimage,flatpak$SNAP_FORMAT $APPIMAGE_ARGS"
          if [[ -n "$SNAP_FORMAT" ]]; then sg lxd -c "$build"; else $build; fi 2>&1 | tee maven.log

      - name: Build the packages
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ./mvnw -B -ntp install -pl packaging/integration-tests -am -Dno-format $NATIVE_ARGS -Dquarkus.desktop.packaging.formats=directory,msi,exe,msix,dmg,pkg $SIGN_ARGS 2>&1 | tee maven.log

      # JVM mode : the packages of a next version, in target/packaging-next, which the steps below install over the first
      # ones (the formats of the other operating systems are skipped)
      - name: Build the packages of the next version
        if: ${{ !matrix.native && !startsWith(matrix.os, 'macos') }}
        run: ./mvnw -B -ntp package -pl packaging/integration-tests -Dno-format -Dquarkus.desktop.packaging.formats=msi,exe,msix,deb,appimage -Dquarkus.desktop.packaging.version=1.1.0 -Dquarkus.desktop.packaging.output-directory=packaging-next $SIGN_ARGS $APPIMAGE_ARGS 2>&1 | tee -a maven.log

      # The RPM package is installed in a Fedora container. In JVM mode, the Debian package of the next version upgrades
      # the installed one
      - name: Install, start and remove the packages of Linux
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: packaging/integration-tests/target/packaging
        run: |
          started() {
            grep -qF "started 999-SNAPSHOT [$1]" "$2" || { echo "::error::The application of the $1 package did not start"; exit 1; }
            echo "$1 : $(cat "$2")"
          }
          ls -l

          sudo apt-get install -y ./packaging-it_*.deb
          desktop-file-validate /usr/share/applications/packaging-it.desktop
          # the type of the files and the URL scheme, which the triggers of shared-mime-info and desktop-file-utils add
          # to the databases of the system
          grep -q 'application/x-packaging-it-document' /usr/share/mime/packages/packaging-it.xml
          grep -q '^application/x-packaging-it-document=.*packaging-it.desktop' /usr/share/applications/mimeinfo.cache             || { echo "::error::The desktop database has no application for the type of the package"; exit 1; }
          grep -q '^x-scheme-handler/packaging-it=.*packaging-it.desktop' /usr/share/applications/mimeinfo.cache             || { echo "::error::The desktop database has no application for the URL scheme of the package"; exit 1; }
          # the extension of the type in the MIME database, which the file managers read (xdg-mime query filetype
          # does not without a desktop environment : it runs file --mime-type)
          grep -q ':application/x-packaging-it-document:\*\.pit$' /usr/share/mime/globs2             || { echo "::error::The MIME database has no extension for the type of the package"; exit 1; }
          packaging-it --marker="$RUNNER_TEMP/deb.txt" deb
          started deb "$RUNNER_TEMP/deb.txt"
          if [[ -z "$NATIVE_ARGS" ]]; then
            sudo apt-get install -y ../packaging-next/packaging-it_*.deb
            version=$(dpkg-query -W -f '${Version}' packaging-it)
            [[ "$version" == 1.1.0-1 ]] || { echo "::error::The Debian package of the next version installed the version $version"; exit 1; }
            packaging-it --marker="$RUNNER_TEMP/deb-next.txt" deb
            started deb "$RUNNER_TEMP/deb-next.txt"
          fi
          sudo apt-get remove -y packaging-it
          test ! -e /opt/packaging-it

          docker run --rm -v "$PWD:/packages:ro" fedora:latest sh -c "dnf install -y /packages/packaging-it-*.rpm \
            && packaging-it --marker=/tmp/rpm.txt rpm && cat /tmp/rpm.txt && rpm -e packaging-it && test ! -e /opt/packaging-it" \
            | tee "$RUNNER_TEMP/rpm.txt"
          started rpm "$RUNNER_TEMP/rpm.txt"

          ./Packaging-IT-*.AppImage --appimage-extract-and-run --marker="$RUNNER_TEMP/appimage.txt" appimage
          started appimage "$RUNNER_TEMP/appimage.txt"
          # The update information of the AppImage, and its .zsync file
          appimage=$(ls Packaging-IT-*.AppImage)
          test -s "$appimage.zsync"
          ./"$appimage" --appimage-updateinformation | tee "$RUNNER_TEMP/updateinformation.txt"
          grep -qF 'zsync|http://127.0.0.1:8123/Packaging-IT-latest.AppImage.zsync' "$RUNNER_TEMP/updateinformation.txt"
          if [[ -z "$NATIVE_ARGS" ]]; then
            # JVM mode : the AppImage of the next version, published with its .zsync file under the name of the update
            # information, updates this one (AppImageUpdate writes the new AppImage next to it, by the name in the .zsync
            # file)
            next=$(cd ../packaging-next && ls Packaging-IT-*.AppImage)
            mkdir "$RUNNER_TEMP/appimage-server" "$RUNNER_TEMP/appimage-update"
            cp "../packaging-next/$next" "$RUNNER_TEMP/appimage-server/"
            cp "../packaging-next/$next.zsync" "$RUNNER_TEMP/appimage-server/Packaging-IT-latest.AppImage.zsync"
            # zsync downloads ranges of the AppImage : nginx serves them (the server of Python does not), as the user of
            # the job, with its files in a directory of the job
            nginx_dir="$RUNNER_TEMP/nginx"
            mkdir "$nginx_dir"
            {
              echo "pid $nginx_dir/nginx.pid;"
              echo "error_log $nginx_dir/error.log;"
              echo 'events {}'
              echo 'http {'
              echo "  access_log $nginx_dir/access.log;"
              for temp in client_body proxy fastcgi uwsgi scgi; do echo "  ${temp}_temp_path $nginx_dir/$temp;"; done
              echo "  server { listen 127.0.0.1:8123; root $RUNNER_TEMP/appimage-server; }"
              echo '}'
            } > "$nginx_dir/nginx.conf"
            nginx -e "$nginx_dir/error.log" -c "$nginx_dir/nginx.conf"
            cp "$appimage" "$RUNNER_TEMP/appimage-update/"
            # an update is available : exit code 1 of --check-for-update
            status=0
            appimageupdatetool --appimage-extract-and-run --check-for-update "$RUNNER_TEMP/appimage-update/$appimage" || status=$?
            [[ "$status" == 1 ]] || { echo "::error::appimageupdatetool found no update of the AppImage ($status)"; cat "$nginx_dir/access.log"; exit 1; }
            appimageupdatetool --appimage-extract-and-run "$RUNNER_TEMP/appimage-update/$appimage"
            ls -l "$RUNNER_TEMP/appimage-update"
            cmp "$RUNNER_TEMP/appimage-update/$next" "../packaging-next/$next" || { echo "::error::The updated AppImage is not the one of the next version"; exit 1; }
            nginx -e "$nginx_dir/error.log" -c "$nginx_dir/nginx.conf" -s stop
          fi

          # No remote before : the installation adds Flathub, the repository of the runtime that the bundle names
          flatpak install --user -y --noninteractive ./Packaging-IT-*.flatpak
          remotes=$(flatpak remotes --user --columns=name,url)
          echo "flatpak remotes : $remotes"
          grep -q 'dl.flathub.org/repo' <<< "$remotes"
          # The command and the default permissions of the sandbox (linux.flatpak.finish-args)
          metadata=$(flatpak info --user --show-metadata io.quarkiverse.desktop.PackagingIt)
          permissions=$(flatpak info --user --show-permissions io.quarkiverse.desktop.PackagingIt)
          echo "$metadata"
          grep -qx 'command=packaging-it' <<< "$metadata"
          for permission in 'sockets=x11;wayland;pulseaudio;' 'devices=dri;' 'filesystems=home;'; do
            grep -q "$permission" <<< "$permissions"
          done
          flatpak run io.quarkiverse.desktop.PackagingIt --marker="$HOME/flatpak.txt" flatpak
          started flatpak "$HOME/flatpak.txt"
          flatpak uninstall --user -y --noninteractive io.quarkiverse.desktop.PackagingIt

          if [[ -n "$SNAP_FORMAT" ]]; then
            # the snaps that the snap needs (its base and the GNOME content snap) come from the snap store
            for attempt in 1 2 3; do sudo snap install --dangerous ./packaging-it_*.snap && break || sleep 30; done
            snap list packaging-it || { echo "::error::The snap could not be installed (the snaps it needs come from the snap store)"; exit 1; }
            /snap/bin/packaging-it --marker="$HOME/snap.txt" snap
            started snap "$HOME/snap.txt"
            sudo snap remove packaging-it
          fi

      - name: Install, start and remove the packages of macOS
        if: startsWith(matrix.os, 'macos')
        working-directory: packaging/integration-tests/target/packaging
        run: |
          # LaunchServices, which opens the bundles as the Finder does, may pass the serial number of the process
          # (-psn_...) before the arguments
          started() {
            grep -qE "^started 999-SNAPSHOT \[(-psn_[0-9_]+, )?$1\]$" "$2" || { echo "::error::The application of the $1 package did not start"; exit 1; }
            echo "$1 : $(cat "$2")"
          }
          # Starts the bundle of a package twice : its executable, whose exit status fails the step and whose output goes
          # to the log, then the bundle as the Finder opens it, by LaunchServices, which reads its Info.plist. open passes
          # on neither the exit status nor the output of the application : the output goes to files, which the log shows
          start_bundle() {
            "$2/Contents/MacOS/Packaging IT" --marker="$RUNNER_TEMP/$1-direct.txt" "$1"
            started "$1" "$RUNNER_TEMP/$1-direct.txt"
            touch "$RUNNER_TEMP/$1.out" "$RUNNER_TEMP/$1.err"
            open -W -n --stdout "$RUNNER_TEMP/$1.out" --stderr "$RUNNER_TEMP/$1.err" "$2" --args --marker="$RUNNER_TEMP/$1.txt" "$1"
            cat "$RUNNER_TEMP/$1.out" "$RUNNER_TEMP/$1.err"
            started "$1" "$RUNNER_TEMP/$1.txt"
          }
          ls -l
          codesign --verify --deep --strict --verbose=2 "image/Packaging IT.app"
          # A line of the signature of the bundle
          signature_has() {
            grep -qE "$1" <<< "$signature" || { echo "::error::The signature of the bundle has no line $1"; exit 1; }
          }
          signature=$(codesign -dvv "image/Packaging IT.app" 2>&1)
          echo "$signature"
          if [[ -z "$NATIVE_ARGS" ]]; then
            # JVM mode : the identity of the job, the hardened runtime, a secure time stamp, and the entitlements of the
            # JVM, without which it does not start under the hardened runtime (the steps below start it)
            signature_has '^Authority=Packaging IT$'
            signature_has '^CodeDirectory .* flags=[^ ]*runtime'
            signature_has '^Timestamp='
            entitlements=$(codesign -d --entitlements - "image/Packaging IT.app" 2>&1)
            echo "$entitlements"
            grep -q 'com.apple.security.cs.allow-jit' <<< "$entitlements" || { echo "::error::The bundle lacks the entitlements of the JVM"; exit 1; }
            codesign --verify --verbose=2 Packaging-IT-*.dmg
          else
            signature_has '^Signature=adhoc$'
          fi
          plutil -lint "image/Packaging IT.app/Contents/Info.plist"
          # the type of the files and the URL scheme of the application
          plist_is() {
            value=$(/usr/libexec/PlistBuddy -c "Print :$1" "image/Packaging IT.app/Contents/Info.plist")
            [[ "$value" == "$2" ]] || { echo "::error::$1 of the Info.plist is $value, not $2"; exit 1; }
          }
          plist_is CFBundleDocumentTypes:0:LSItemContentTypes:0 io.quarkiverse.desktop.PackagingIt.document
          plist_is UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0 pit
          plist_is CFBundleURLTypes:0:CFBundleURLSchemes:0 packaging-it
          # The icon that the Info.plist names, which macOS decodes
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "image/Packaging IT.app/Contents/Info.plist")
          sips -s format png "image/Packaging IT.app/Contents/Resources/${icon%.icns}.icns" --out "$RUNNER_TEMP/icon.png"
          test -s "$RUNNER_TEMP/icon.png"

          hdiutil attach Packaging-IT-*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          test -L "$RUNNER_TEMP/dmg/Applications"
          start_bundle dmg "$RUNNER_TEMP/dmg/Packaging IT.app"
          hdiutil detach "$RUNNER_TEMP/dmg" || { sleep 5; hdiutil detach -force "$RUNNER_TEMP/dmg"; }

          sudo installer -pkg Packaging-IT-*.pkg -target /
          start_bundle pkg "/Applications/Packaging IT.app"
          pkgutil --pkg-info io.quarkiverse.desktop.PackagingIt
          sudo rm -rf "/Applications/Packaging IT.app"

      - name: Install, start and remove the packages of Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        working-directory: packaging/integration-tests/target/packaging
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:ProgramFiles\Packaging IT"
          $launcher = "$directory\Packaging IT.exe"
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Packaging IT.lnk"
          # The entries of the installed programs (Settings, Apps) named after the application
          function Get-UninstallEntry {
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object DisplayName -eq 'Packaging IT'
          }
          # A valid signature of the certificate of the job : not the one of another signer, nor of a file changed after
          # its signature (HashMismatch)
          function Assert-Signed([string]$file) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            "$($signature.Status) $($signature.SignerCertificate.Subject) $file"
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ne 'CN=Quarkiverse') {
              throw "$file : $($signature.Status) $($signature.SignerCertificate.Subject) $($signature.StatusMessage)"
            }
          }
          # The shortcut of the Start menu, which starts the launcher, the entry of the installed programs, and the
          # signature of the installed launcher
          function Assert-Installed([string]$format, [string]$version) {
            if (-not (Test-Path $shortcut)) { throw "$format : $shortcut is not installed" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
            if ($target -ne $launcher) { throw "$format : the shortcut of the Start menu starts $target" }
            $entries = @(Get-UninstallEntry)
            if ($entries.Count -ne 1) { throw "$format : $($entries.Count) entries of the installed programs" }
            $entry = "$($entries[0].DisplayName) $($entries[0].DisplayVersion) of $($entries[0].Publisher)"
            if ($entry -ne "Packaging IT $version of Quarkiverse") { throw "$format : the installed programs list $entry" }
            Assert-Signed $launcher
            "$format : $entry, $shortcut"
          }
          function Start-Installed([string]$format) {
            if (-not (Test-Path $launcher)) { throw "$format : $launcher is not installed" }
            $marker = "$env:RUNNER_TEMP\$format.txt"
            # not the marker of the version before an upgrade
            Remove-Item $marker -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $launcher -ArgumentList "--marker=$marker", $format -Wait -PassThru
            $line = Get-Content $marker
            if ($process.ExitCode -ne 0 -or $line -ne "started 999-SNAPSHOT [$format]") { throw "$format : exit code $($process.ExitCode), $line" }
            "$format : $line"
          }
          # A file of the type of the application (application.properties), opened as the Explorer opens it : the
          # application gets its path alone, and writes that it started next to it
          function Open-Document([string]$format) {
            $document = "$env:RUNNER_TEMP\$format document.pit"
            Set-Content -Path $document -Value 'document'
            Remove-Item "$document.started" -ErrorAction SilentlyContinue
            Start-Process -FilePath $document
            for ($second = 0; $second -lt 60 -and -not (Test-Path "$document.started"); $second++) { Start-Sleep -Seconds 1 }
            $line = if (Test-Path "$document.started") { Get-Content "$document.started" } else { "no $document.started" }
            if ($line -ne "started 999-SNAPSHOT [$document]") { throw "$format : the document did not open the application ($line)" }
            "$format : opened $document"
            $command = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\packaging-it\shell\open\command').'(default)'
            if (-not $command) { throw "$format : the URL scheme packaging-it is not registered" }
            "$format : packaging-it:// opens $command"
          }
          function Assert-Removed([string]$format) {
            if (Test-Path $launcher) { throw "$format : $launcher is still installed" }
            foreach ($key in 'Registry::HKEY_CLASSES_ROOT\.pit', 'Registry::HKEY_CLASSES_ROOT\packaging-it') {
              if (Test-Path $key) { throw "$format : $key remains" }
            }
            foreach ($path in $directory, $shortcut) {
              if (Test-Path $path) { throw "$format : $path remains" }
            }
            if (@(Get-UninstallEntry).Count -ne 0) { throw "$format : the entry of the installed programs remains" }
          }
          Get-ChildItem
          $signed = @((Get-ChildItem *.msi, *.exe, *.msix).FullName) + (Resolve-Path 'image\Packaging IT\Packaging IT.exe').Path
          foreach ($file in $signed) { Assert-Signed $file }

          $msi = (Get-ChildItem *.msi).FullName
          $process = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msi : msiexec /i exited with $($process.ExitCode)" }
          # the MSI package has the numbers of the version of the packages : 1.0.0-SNAPSHOT (application.properties)
          Assert-Installed 'msi' '1.0.0'
          Start-Installed 'msi'
          Open-Document 'msi'
          if (-not $env:NATIVE_ARGS) {
            # JVM mode : the MSI package of the next version replaces the installed one, which has its upgrade code
            $msi = (Get-ChildItem ..\packaging-next\*.msi).FullName
            $process = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "msi : msiexec /i of the next version exited with $($process.ExitCode)" }
            Assert-Installed 'msi' '1.1.0'
            Start-Installed 'msi'
          }
          $process = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msi : msiexec /x exited with $($process.ExitCode)" }
          Assert-Removed 'msi'
          # the registry value of the shortcut, written for the user who installs the package
          if (Test-Path 'HKCU:\Software\Quarkiverse\Packaging IT') { throw 'msi : HKCU:\Software\Quarkiverse\Packaging IT remains' }

          $process = Start-Process (Get-ChildItem *.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "exe : the setup program exited with $($process.ExitCode)" }
          Assert-Installed 'exe' '1.0.0-SNAPSHOT'
          Start-Installed 'exe'
          Open-Document 'exe'
          if (-not $env:NATIVE_ARGS) {
            # JVM mode : the setup program of the next version installs over the installed one, in its directory
            $process = Start-Process (Get-ChildItem ..\packaging-next\*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "exe : the setup program of the next version exited with $($process.ExitCode)" }
            Assert-Installed 'exe' '1.1.0'
            Start-Installed 'exe'
          }
          # the compiler of Inno Setup signs the uninstaller that the setup program installs
          $uninstaller = (Get-ChildItem "$env:ProgramFiles\Packaging IT\unins*.exe").FullName
          Assert-Signed $uninstaller
          Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # the uninstaller ends in a copy of itself, which removes the directory after it
          for ($second = 0; $second -lt 30 -and (Test-Path $directory); $second++) { Start-Sleep -Seconds 1 }
          Assert-Removed 'exe'

          Add-AppxPackage -Path (Get-ChildItem *.msix).FullName
          $package = Get-AppxPackage -Name 'io.quarkiverse.desktop.PackagingIt'
          if (-not $package) { throw 'msix : the package is not installed' }
          "msix : $($package.PackageFullName) in $($package.InstallLocation)"
          if (-not (Test-Path "$($package.InstallLocation)\Packaging IT.exe")) { throw 'msix : the launcher is not installed' }
          # The executable of the application of the manifest, started with the identity of the package. The cmdlet does
          # not wait for it : the marker, then the end of the process
          $application = (Get-AppxPackageManifest -Package $package.PackageFullName).Package.Applications.Application
          $marker = "$env:RUNNER_TEMP\msix.txt"
          Invoke-CommandInDesktopPackage -PackageFamilyName $package.PackageFamilyName -AppId $application.Id `
            -Command (Join-Path $package.InstallLocation $application.Executable) -Args "`"--marker=$marker`" msix"
          for ($second = 0; $second -lt 60 -and -not (Test-Path $marker); $second++) { Start-Sleep -Seconds 1 }
          Get-Process -Name 'Packaging IT' -ErrorAction SilentlyContinue | Wait-Process -Timeout 60
          $line = if (Test-Path $marker) { Get-Content $marker } else { "no $marker" }
          if ($line -ne 'started 999-SNAPSHOT [msix]') { throw "msix : the application did not start ($line)" }
          "msix : $line"
          # the file type of the package, which Windows associates with the application of the package
          $document = "$env:RUNNER_TEMP\msix document.pit"
          Set-Content -Path $document -Value 'document'
          Start-Process -FilePath $document
          for ($second = 0; $second -lt 60 -and -not (Test-Path "$document.started"); $second++) { Start-Sleep -Seconds 1 }
          $line = if (Test-Path "$document.started") { Get-Content "$document.started" } else { "no $document.started" }
          if ($line -ne "started 999-SNAPSHOT [$document]") { throw "msix : the document did not open the application ($line)" }
          "msix : opened $document"
          Remove-AppxPackage -Package $package.PackageFullName

          if (-not $env:NATIVE_ARGS) {
            # JVM mode : the MSIX package installed from its App Installer file, served on the loopback interface, then
            # updated from the one of the next version, published at the same URL, which Windows keeps with the package
            $server = "$env:RUNNER_TEMP\msix-server"
            New-Item -ItemType Directory $server | Out-Null
            Copy-Item *.msix, *.appinstaller $server
            $appInstaller = (Get-ChildItem "$server\*.appinstaller").Name
            "msix : App Installer file $appInstaller"
            Get-Content "$server\$appInstaller"
            # Windows downloads the package by ranges (Delivery Optimization), which the server of Python does not serve
            $serverLog = "$env:RUNNER_TEMP\msix-server.log"
            $java = Start-Process java -ArgumentList "`"$env:GITHUB_WORKSPACE\.github\scripts\RangeServer.java`"", '8124', "`"$server`"" `
              -PassThru -NoNewWindow -RedirectStandardOutput $serverLog -RedirectStandardError "$serverLog.err"
            for ($second = 0; $second -lt 30 -and -not (Select-String -Path $serverLog -Pattern 'serving' -Quiet -ErrorAction SilentlyContinue); $second++) { Start-Sleep -Seconds 1 }
            function Install-FromAppInstaller {
              try {
                Add-AppxPackage -AppInstallerFile "http://127.0.0.1:8124/$appInstaller"
              } catch {
                Get-Content $serverLog, "$serverLog.err" -ErrorAction SilentlyContinue
                if ("$_" -match '\[ActivityId\] ([0-9a-f-]+)') {
                  try { Get-AppPackageLog -ActivityID $Matches[1] | Select-Object -Last 20 | Format-List | Out-String } catch {}
                }
                throw
              }
            }
            Install-FromAppInstaller
            $package = Get-AppxPackage -Name 'io.quarkiverse.desktop.PackagingIt'
            if ("$($package.Version)" -ne '1.0.0.0') { throw "msix : the App Installer file installed the version $($package.Version)" }
            $uri = $package.GetAppInstallerInfo().Uri
            if ("$uri" -ne "http://127.0.0.1:8124/$appInstaller") { throw "msix : the App Installer URL of the package is $uri" }
            "msix : $($package.PackageFullName) from $uri"
            Remove-Item "$server\*"
            Copy-Item ..\packaging-next\*.msix, ..\packaging-next\*.appinstaller $server
            if (-not (Test-Path "$server\$appInstaller")) { throw "msix : the next version has no $appInstaller" }
            Install-FromAppInstaller
            $package = Get-AppxPackage -Name 'io.quarkiverse.desktop.PackagingIt'
            if ("$($package.Version)" -ne '1.1.0.0') { throw "msix : the App Installer file of the next version installed the version $($package.Version)" }
            "msix : updated to $($package.PackageFullName)"
            Remove-AppxPackage -Package $package.PackageFullName
            Get-Content $serverLog
            Stop-Process -Id $java.Id
          }

      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log

  packaging-ui:
    # The packaged application with a window (packaging/ui-integration-tests), with Desktop Swing and Desktop SWT, in
    # JVM mode and as a native executable : its package
    # is installed (deb, msi, pkg), then .github/scripts/packaging-ui.* start the application with a file, start it a
    # second time (single instance), open a file and a URL with it as the system does, stop it, and take a screenshot
    name: Packaging UI - ${{ matrix.toolkit }}${{ matrix.native && ' (native)' || '' }} on ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        toolkit: [ swing, swt ]
        native: [ false, true ]
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_ARGS: ${{ matrix.native && '-Dnative' || '' }}
      TOOLKIT: ${{ matrix.toolkit }}
      MODE: ${{ matrix.native && 'native' || 'jvm' }}
      SCREENSHOT: ${{ github.workspace }}/screenshots/${{ matrix.os }}-${{ matrix.toolkit }}-${{ matrix.native && 'native' || 'jvm' }}.png
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up JDK 25
        if: ${{ !matrix.native }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up GraalVM Community 25 Innovation 5 (JDK 25)
        if: ${{ matrix.native }}
        run: bash .github/scripts/setup-graalvm.sh

      - name: Cache the Maven repository of the packaging modules
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: packaging-ui-${{ runner.os }}-${{ matrix.toolkit }}-${{ matrix.native }}-maven-${{ hashFiles('**/pom.xml') }}

      # Not the libraries of the application : the Debian package depends on them. A virtual X display, the screenshot
      # (ImageMagick), gio, which opens files and URLs as the file managers do, and desktop-file-utils, whose trigger
      # adds the types of the installed desktop entries to the desktop database (mimeinfo.cache), as on a desktop
      - name: Install the tools of Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev dpkg-dev xvfb imagemagick libglib2.0-bin desktop-file-utils

      - name: Install the tools of Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the package
        run: |
          case "$RUNNER_OS" in
            Linux) format=deb ;;
            Windows) format=msi ;;
            macOS) format=pkg ;;
          esac
          ./mvnw -B -ntp install -pl packaging/ui-integration-tests -am -Dui-it -P${{ matrix.toolkit }} -DskipTests -Dno-format $NATIVE_ARGS -Dquarkus.desktop.packaging.formats=$format 2>&1 | tee maven.log

      - name: Install, use and remove the package of Linux
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: packaging/ui-integration-tests/target/packaging
        run: |
          ls -l
          sudo apt-get install -y ./packaging-ui-it_*.deb
          xvfb-run -a -s '-screen 0 1280x800x24' bash "$GITHUB_WORKSPACE/.github/scripts/packaging-ui.sh"
          sudo apt-get remove -y packaging-ui-it

      - name: Install, use and remove the package of macOS
        if: startsWith(matrix.os, 'macos')
        working-directory: packaging/ui-integration-tests/target/packaging
        run: |
          ls -l
          sudo installer -pkg Packaging-UI-IT-*.pkg -target /
          bash "$GITHUB_WORKSPACE/.github/scripts/packaging-ui.sh"
          sudo rm -rf "/Applications/Packaging UI IT.app"

      - name: Install, use and remove the package of Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        working-directory: packaging/ui-integration-tests/target/packaging
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem
          $msi = (Get-ChildItem *.msi).FullName
          $process = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msiexec /i exited with $($process.ExitCode)" }
          & "$env:GITHUB_WORKSPACE\.github\scripts\packaging-ui.ps1"
          $process = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msiexec /x exited with $($process.ExitCode)" }

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}-${{ matrix.toolkit }}-${{ matrix.native && 'native' || 'jvm' }}
          path: screenshots/
          if-no-files-found: ignore

      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log

  packaging-latest-jdk:
    # The default Java runtime of JVM mode (no jvm.modules) built by the jpackage of the latest JDK : the extension gives
    # jpackage ALL-DEFAULT as the last of its modules, which a jpackage that reorders them may ignore. The order of a set
    # changes with each process, so the test runs five times
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'packaging' }}
    name: Packaging - JDK 27 on ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: 'maven'

      - name: Build the packaging modules
        run: ./mvnw -B -ntp install -pl packaging/deployment -am -DskipTests -Dno-format 2>&1 | tee maven.log

      - name: Build the default Java runtime five times
        run: |
          for run in 1 2 3 4 5; do
            echo "::group::run $run"
            ./mvnw -B -ntp surefire:test -pl packaging/deployment \
                -Dtest=ApplicationImageTest#theDefaultJavaRuntimeHasTheProvidersOfServices 2>&1 | tee -a maven.log
            echo "::endgroup::"
          done
          # the test is skipped when the JDK has no jpackage : that is no check
          ran=$(grep -c 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 0' maven.log || true)
          [ "$ran" -ge 5 ] || { echo "::error::The test of the default Java runtime did not run five times ($ran)"; exit 1; }

      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log
