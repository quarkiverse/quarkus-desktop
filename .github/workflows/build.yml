name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash runs the steps with -eo pipefail : a build piped to tee still fails its step
defaults:
  run:
    shell: bash

jobs:
  build:
    name: JVM - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    # a hung GUI test (an event loop, a modal dialog) : about 2 minutes otherwise
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java-version: [ 17, 25 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      # SWT needs GTK 3 on Linux
      - name: Install the GTK 3 runtime libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64

      # AWT, Swing and SWT tests need a display : a virtual X display on Linux
      - name: Build with Maven (virtual X display)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a ./mvnw -B -ntp clean install -Dno-format 2>&1 | tee maven.log

      - name: Build with Maven
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ./mvnw -B -ntp clean install -Dno-format 2>&1 | tee maven.log

      # The failed tests and the Maven errors as annotations of the run : shown in its summary, and readable through the
      # public API (check run annotations) without logging in, unlike the logs
      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log

  native:
    # No macOS native job yet : macOS native executables need Quarkus 4.0 or later (the quarkus-awt with macOS support of
    # https://github.com/quarkusio/quarkus/pull/56979, not released yet) and GraalVM 25.1 or later
    # exact : the integration tests built with --exact-reachability-metadata, in the default configuration of the
    # extensions (they fail on the first lookup missing from the metadata)
    name: Native${{ matrix.exact && ' (exact)' || '' }} on ${{ matrix.os }}
    # a hung native executable or GUI test : about 15 minutes otherwise
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        exact: [ false, true ]
    runs-on: ${{ matrix.os }}
    env:
      EXACT_ARGS: ${{ matrix.exact && '-Dquarkus.native.additional-build-args=--exact-reachability-metadata' || '' }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # The AWT libraries of the native executable are linked dynamically : running it needs the X11, font, sound,
      # printing and GTK runtime libraries of the host, and a (virtual) X display (SWT loads GTK 3 too)
      - name: Install native build and run prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev xvfb fonts-dejavu-core \
            libx11-6 libxext6 libxrender1 libxi6 libxtst6 libfreetype6 libfontconfig1 libasound2t64 libcups2t64 \
            libgtk-3-0t64

      - name: Build native executables and run the integration tests (virtual X display)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a ./mvnw -B -ntp clean install -Dnative -Dno-format -Dnative.surefire.skip $EXACT_ARGS 2>&1 | tee maven.log

      - name: Build native executables and run the integration tests
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ./mvnw -B -ntp clean install -Dnative -Dno-format -Dnative.surefire.skip $EXACT_ARGS 2>&1 | tee maven.log

      - name: Report the failures
        if: failure()
        run: java .github/scripts/ReportFailures.java maven.log
