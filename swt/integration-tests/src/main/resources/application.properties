# The integration tests run a command mode application : see the @QuarkusMain class of this module.
quarkus.banner.enabled=false
# A user interface application (ItUserInterface observes SwtStartupEvent), started by the @QuarkusMain class with
# SwtLifecycle.run() : also in the tests (@QuarkusMainTest), where the main thread runs it as in production
%test.quarkus.desktop.swt.startup-event.enabled=true
quarkus.desktop.swt.application-name=Quarkus Desktop SWT IT
# The images of the checks
quarkus.native.resources.includes=io/quarkiverse/desktop/swt/it/**
