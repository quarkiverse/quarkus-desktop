quarkus.banner.enabled=false
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Feature pages and main windows are only looked up through Instance<...>
quarkus.arc.remove-unused-beans=false

# Application resources (images, fonts, documents, sounds... of the pages)
quarkus.native.resources.includes=showcase/**
# (the custom ImageIO plugin's META-INF/services files and its metadata format bundle are registered in
# META-INF/native-image/io.quarkiverse.desktop.showcase/quarkus-desktop-showcase/reachability-metadata.json)

# Locales whose JDK resource bundles and locale data are included in the native executable (by default only the build
# locale): the localized Swing/AWT/accessibility strings and the number and date formats of the i18n checks
# (swing-option-pane-dialogs, swing-choosers, swing-rtl-i18n, a11y-contexts). Not th : the dictionary based Thai line
# breaks cannot work in a native executable (GraalVM returns the break iterators of the build locale, see
# overview-native-limits)
quarkus.locales=en-US,de,de-DE,ja,ja-JP,zh-CN,ar-SA

# The JavaBeans pages (beans-introspection, beans-xml-persistence, beans-xml-persistence-swing) introspect, encode and
# decode the AWT and Swing classes of the JDK (components, layouts, events...) : their bean properties are registered for
# native executables (quarkus.desktop.awt.java-beans.jdk-classes is true by default, the Swing one is not)
quarkus.desktop.swing.java-beans.jdk-classes=true

# The pages use https URLs as data (clipboard URL flavor, HTML links, URL.toString()) : a native executable only has the
# URL handlers it is built with (no connection is ever opened)
quarkus.native.enable-https-url-handler=true

# core/Foreground asks Windows which process owns the foreground (Edt.ownsFocus : Robot keys only go to the showcase)
# with the Foreign Function and Memory API : native access enabled (no warning), in the JVM run jar and in native
# executables (the downcalls are registered in META-INF/native-image/.../reachability-metadata.json). The native option,
# quarkus.native.additional-build-args-append, is a property of pom.xml : its mac profile adds the add-opens of
# core/MacPeers to it, and a value here would take precedence over both.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# Deliberately NOT set: quarkus.native.headless (it only configures the image builder JVM, whether an executable is
# headless is decided at run time by the JDK), and no java.home feature (AWT reads java.home: quarkus-desktop handles it).

# Page filter (interactive and snapshot mode): comma separated page ids (an entry ending with - or * is an id prefix),
# and category names or keys (see core/Categories)
#showcase.pages=overview-environment,j2d-
#showcase.categories=java2d
# Main window: swing (default when quarkus-desktop-swing is present) or awt
#showcase.ui=awt

# Snapshot mode is enabled by setting showcase.snapshot.dir (see tools/Snapshot.java)
showcase.snapshot.exit=true
showcase.snapshot.settle-millis=400
showcase.snapshot.ready-timeout-seconds=30
