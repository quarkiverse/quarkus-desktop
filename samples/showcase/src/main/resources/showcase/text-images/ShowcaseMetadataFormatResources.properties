# Descriptions of the native metadata format of the showcase ImageIO plugin (IIOMetadataFormatImpl resource bundle)
Header=The image header: size and transparency
Header/width=The width of the image, in pixels
Header/height=The height of the image, in pixels
Header/alpha=Whether the pixels have an alpha channel
Comment=A comment stored with the image
Comment/value=The text of the comment (UTF-8)
