# The integration tests run a command mode application : see the @QuarkusMain class of this module.
# Nothing else is needed for AWT : the Desktop AWT extension configures the native build.
quarkus.banner.enabled=false
# A user interface application (UserInterface observes DesktopStartupEvent), started by the @QuarkusMain class
quarkus.desktop.awt.startup-event.mode=manual
%test.quarkus.desktop.awt.startup-event.enabled=true
# the checks open and close windows
quarkus.desktop.awt.exit-on-last-window-closed=false
