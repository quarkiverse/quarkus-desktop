# The packaged application with a window : see Events. Built with Desktop Swing or Desktop SWT (see the pom.xml)
quarkus.banner.enabled=false
quarkus.log.level=WARN

quarkus.desktop.packaging.name=Packaging UI IT
quarkus.desktop.packaging.identifier=io.quarkiverse.desktop.PackagingUiIt
quarkus.desktop.packaging.vendor=Quarkiverse
quarkus.desktop.packaging.description=The packaged application with a window of the Quarkus Desktop Packaging integration tests
quarkus.desktop.packaging.version=1.0.0
quarkus.desktop.packaging.file-types.document.extensions=pui
quarkus.desktop.packaging.file-types.document.description=Packaging UI IT document
quarkus.desktop.packaging.url-schemes=packaging-ui-it

# A second launch gives its files and URLs to the running instance (the toolkit of the build reads its own property)
quarkus.desktop.awt.single-instance=true
quarkus.desktop.swt.single-instance=true
# The property of the other toolkit is unknown : no warning
quarkus.log.category."io.quarkus.config".level=ERROR
