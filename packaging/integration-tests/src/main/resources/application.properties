# The packaged application : see PackagedApplication. The formats of its packages are a property of the pom.xml
# (quarkus.desktop.packaging.formats), which the command line overrides.
quarkus.banner.enabled=false
quarkus.log.level=WARN

# A name with a space : the name of the launcher on Windows and of the application bundle on macOS
quarkus.desktop.packaging.name=Packaging IT
quarkus.desktop.packaging.identifier=io.quarkiverse.desktop.PackagingIt
quarkus.desktop.packaging.vendor=Quarkiverse
quarkus.desktop.packaging.description=The packaged application of the Quarkus Desktop Packaging integration tests
quarkus.desktop.packaging.copyright=Copyright (c) Quarkiverse
quarkus.desktop.packaging.homepage=https://github.com/quarkiverse/quarkus-desktop

# A small Java runtime for the application image of JVM mode : a command mode application without extension needs
# no more than the modules of Quarkus itself, which the extension adds to this list
quarkus.desktop.packaging.jvm.modules=java.base
